<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- washi-paper background, gently warm -->
  <rect width="64" height="64" rx="10" fill="#f3ecdf"/>
  <!-- subtle paper grain -->
  <rect width="64" height="64" rx="10" fill="#e8dcc1" opacity="0.18"/>
  <!-- enso (zen circle), drawn with a gap so it reads as a brush stroke -->
  <g transform="rotate(-22 32 32)">
    <circle cx="32" cy="32" r="22"
            fill="none"
            stroke="#2a241c"
            stroke-width="3.6"
            stroke-linecap="round"
            stroke-dasharray="125 18"
            stroke-dashoffset="-4"
            opacity="0.92"/>
  </g>
  <!-- a single warm-gold dot, like the moment the bell strikes -->
  <circle cx="32" cy="11" r="2.2" fill="#b08d57"/>
</svg>
