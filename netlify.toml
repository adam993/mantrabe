# Netlify config.
#
# We don't bundle the Android APK into dist/ — it's far too big and the
# GitHub Actions workflow that builds it (.github/workflows/android-
# release.yml) often hasn't finished by the time Netlify deploys. Instead
# we expose a stable in-domain URL (/mantrabe-android.apk) that 302s to
# the rolling `android-latest` GitHub Release asset. That URL is what
# the Download button links to, and the redirect target is whatever the
# latest workflow run produced.

[build]
  command = "yarn build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/mantrabe-android.apk"
  to = "https://github.com/adam993/mantrabe/releases/download/android-latest/mantrabe-android-latest.apk"
  status = 302
  force = true

# Legacy path that earlier web bundles linked to. Already-loaded
# clients in the wild still resolve their cached href against this
# path, so keep redirecting it to the same release asset.
[[redirects]]
  from = "/latest-release.apk"
  to = "https://github.com/adam993/mantrabe/releases/download/android-latest/mantrabe-android-latest.apk"
  status = 302
  force = true

[[redirects]]
  from = "/mantrabe-android-latest.apk"
  to = "https://github.com/adam993/mantrabe/releases/download/android-latest/mantrabe-android-latest.apk"
  status = 302
  force = true

# iOS distribution via AltStore. The workflow at .github/workflows/ios-
# release.yml publishes an unsigned .ipa + an AltStore source JSON to the
# rolling `ios-latest` GitHub Release. These two redirects expose stable
# in-domain URLs so users can paste a clean address into AltStore and so
# the source JSON's downloadURL doesn't have to change between builds.
#
# `force = true` is important: without it Netlify would 404 here (no
# matching file in dist/) before consulting the redirect table.
[[redirects]]
  from = "/altstore-source.json"
  to = "https://github.com/adam993/mantrabe/releases/download/ios-latest/altstore-source.json"
  status = 302
  force = true

[[redirects]]
  from = "/mantrabe-ios.ipa"
  to = "https://github.com/adam993/mantrabe/releases/download/ios-latest/mantrabe-ios-latest.ipa"
  status = 302
  force = true
