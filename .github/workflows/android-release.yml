name: Build Android APK

# Builds the Android APK and publishes it to the rolling GitHub Release
# tagged `android-latest`. The Netlify deploy (see netlify.toml)
# 302-redirects /mantrabe-android.apk to that release asset, so the
# "Download Android app" button always serves the freshest APK without
# bundling it into the web deploy.
#
# Triggers (opt-in only — most pushes don't need a fresh APK):
#   1. workflow_dispatch — click "Run workflow" in the Actions tab.
#   2. Pushing a version tag (`git push origin v0.3.0`).
#   3. Pushing a commit to master whose message includes `[android]`.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [master]

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # On a plain master push, only run if the commit message opts in with
    # `[android]`. workflow_dispatch and tag pushes always run.
    if: >-
      github.event_name != 'push' ||
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[android]')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore stable debug keystore
        # Without this, every CI run generates a fresh ~/.android/debug.keystore
        # and the resulting APK is signed by a different key each time —
        # devices then refuse to install the new APK over the old one with
        # INSTALL_FAILED_UPDATE_INCOMPATIBLE. The secret holds a base64-encoded
        # keystore (alias: androiddebugkey, store/key pass: android, default
        # debug-style identity). Generate once, never rotate unless you're
        # ready to ask every existing user to uninstall.
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_DEBUG_KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 secret is missing or empty. Re-upload it with:" >&2
            echo "::error::  base64 -w0 release/mantrabe-debug.keystore | gh secret set ANDROID_DEBUG_KEYSTORE_B64" >&2
            echo "::error::See the comment block above this step in android-release.yml for why rotating it would break installed users." >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          # Sanity-check: keytool exits non-zero if the file isn't a valid keystore.
          if ! keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android >/dev/null 2>&1; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 decoded but is not a valid keystore (storepass=android). Was it base64-encoded with line wrapping? Use 'base64 -w0' when re-uploading." >&2
            exit 1
          fi

      - name: Build Android APK
        # Vite inlines VITE_* env at bundle time — without these the
        # Supabase client initializes as disabled and the sign-in UI
        # hides itself in the APK.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: yarn build:android

      - name: Read version
        id: version
        run: echo "version=$(node scripts/version.cjs show | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=android-latest
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="Mantrabe v${VERSION} — built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Create the rolling release once; subsequent runs just replace the asset.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Latest Android APK" \
              --notes "$NOTES" \
              --prerelease
          gh release upload "$TAG" release/mantrabe-android-latest.apk --clobber
          gh release edit "$TAG" --notes "$NOTES"
