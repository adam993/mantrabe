name: Build Android APK

# Builds the Android APK on every push to master and publishes it to a
# rolling GitHub Release tagged `android-latest`. The Netlify deploy
# (see netlify.toml + scripts/fetch-public-apk.cjs) downloads that asset
# at build time so the web build's "Download Android app" button always
# serves the freshest APK without needing the Android toolchain on Netlify.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Android APK
        run: yarn build:android

      - name: Read version
        id: version
        run: echo "version=$(node scripts/version.cjs show | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=android-latest
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="Mantrabe v${VERSION} — built from ${GITHUB_SHA::7} on $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Create the rolling release once; subsequent runs just replace the asset.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --title "Latest Android APK" \
              --notes "$NOTES" \
              --prerelease
          gh release upload "$TAG" release/mantrabe-android-latest.apk --clobber
          gh release edit "$TAG" --notes "$NOTES"
