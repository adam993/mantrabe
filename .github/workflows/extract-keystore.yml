name: Extract keystore (one-time)

# Temporary workflow to pull ANDROID_DEBUG_KEYSTORE_B64 out of repo secrets and
# upload the decoded keystore as a build artifact, so we can commit it into the
# repo at keystore/mantrabe-debug.keystore. After the keystore is committed and
# the secret is no longer needed, this workflow file is deleted.
#
# Why an artifact and not just `echo`: keeping the b64 value out of run logs
# even though it's debug-grade.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Decode keystore from secret
        env:
          ANDROID_DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_DEBUG_KEYSTORE_B64:-}" ]; then
            echo "::error::ANDROID_DEBUG_KEYSTORE_B64 secret is empty" >&2
            exit 1
          fi
          mkdir -p out
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_B64" | base64 -d > out/mantrabe-debug.keystore
          keytool -list -keystore out/mantrabe-debug.keystore -storepass android \
            | tee out/keystore-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: mantrabe-debug-keystore
          path: out/
          retention-days: 1
